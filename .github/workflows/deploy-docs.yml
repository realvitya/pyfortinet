name: Publish docs via GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - "pyfortinet/**"
      - "README.md"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "tasks.py"
      - "tests/unit/common/test_docs_generation.py"
      - ".github/workflows/deploy-docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "pyfortinet/**"
      - "README.md"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "tasks.py"
      - "tests/unit/common/test_docs_generation.py"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.9.8"
          python-version: "3.11"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Test reference generation
        run: uv run pytest tests/unit/common/test_docs_generation.py
      - name: Build documentation and API reference
        run: uv run invoke docs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy documentation
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5

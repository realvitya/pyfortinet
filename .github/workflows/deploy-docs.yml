name: Publish docs via GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - "pyfortinet/**"
      - "README.md"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "tasks.py"
      - "tests/unit/common/test_docs_generation.py"
      - "tests/unit/common/test_docs_workflow.py"
      - ".github/workflows/deploy-docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "pyfortinet/**"
      - "README.md"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "tasks.py"
      - "tests/unit/common/test_docs_generation.py"
      - "tests/unit/common/test_docs_workflow.py"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.9.8"
          python-version: "3.11"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Test documentation tooling
        run: uv run pytest tests/unit/common/test_docs_generation.py tests/unit/common/test_docs_workflow.py
      - name: Build documentation and API reference
        run: uv run invoke docs
      # A deploy-key push triggers branch-based Pages publishing. GITHUB_TOKEN
      # pushes do not trigger a Pages build, so do not substitute github_token here.
      - name: Check publishing credentials
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          DOCS_DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        shell: bash
        run: |
          if [ -z "$DOCS_DEPLOY_KEY" ]; then
            echo "::error::Configure the DOCS_DEPLOY_KEY repository secret before publishing."
            exit 1
          fi
      - name: Publish generated site to gh-pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DOCS_DEPLOY_KEY }}
          publish_branch: gh-pages
          publish_dir: ./site
          force_orphan: false
          keep_files: false
